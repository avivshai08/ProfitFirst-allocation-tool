<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profit First — Bottom Line</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;direction:rtl;background:#f5f5f5;min-height:100vh;}
.app{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
:root{--tc:#5BC8C0;--td:#3A9E97;--tl:#E8F8F7;--dk:#1A1A1A;--br:#C8EFED;--bg:#fff;--text:#1a1a1a;--text2:#666;--border:#e0e0e0;--danger:#e24b4a;--danger-bg:#fff0f0;--success:#3B6D11;--success-bg:#EAF3DE;}
.hdr{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;border-radius:12px;background:var(--tc);}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1.2rem;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.card-teal{background:var(--tl);border-color:var(--tc);}
.lbl{font-size:11px;font-weight:600;color:var(--td);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
.inc-wrap{position:relative;}
.inc-sym{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text2);pointer-events:none;}
.inc-fld{width:100%;padding:10px 12px 10px 32px;font-size:18px;font-weight:500;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;direction:ltr;text-align:right;}
.inc-fld:focus{border-color:var(--tc);}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;}
.tbl th{font-size:11px;color:var(--text2);font-weight:400;padding:0 4px 8px;text-align:right;}
.tbl td{padding:5px 4px;vertical-align:middle;}
.tbl tbody tr:not(.opr) td{border-bottom:1px solid #f0f0f0;}
.tbl tbody tr:last-child td{border-bottom:none;}
.opr td{border-top:1px solid var(--br)!important;border-bottom:none!important;padding-top:10px;}
.nc{display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ntxt{font-size:13px;font-weight:500;color:var(--text);}
.ninp{font-size:12px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);width:100%;outline:none;}
.ninp:focus{border-color:var(--tc);}
.twrap{display:flex;gap:3px;justify-content:center;}
.awrap{position:relative;}
.asym{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text2);pointer-events:none;right:8px;}
.ainp{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;font-size:14px;font-weight:500;padding:5px 26px 5px 7px;direction:ltr;text-align:right;}
.ainp:focus{border-color:var(--tc);}
.opinfo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.oppill{font-size:10px;background:var(--tl);border:1px solid var(--tc);border-radius:20px;padding:2px 8px;color:var(--td);}
.opval{font-size:13px;font-weight:500;color:var(--td);}
.opval-neg{font-size:13px;font-weight:500;color:var(--danger);}
.del-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid #ddd;border-radius:6px;background:transparent;cursor:pointer;color:#999;font-size:15px;margin:auto;}
.del-btn:hover{background:var(--danger-bg);color:var(--danger);}
.warnbox{font-size:12px;color:var(--danger);padding:7px 10px;background:var(--danger-bg);border-radius:6px;margin-top:8px;display:none;}
.add-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:8px;border:1px dashed var(--tc);border-radius:8px;background:transparent;cursor:pointer;font-size:13px;color:var(--td);margin-top:8px;}
.add-btn:hover{background:var(--tl);}
.action-btn{width:100%;padding:11px;background:var(--tc);color:var(--dk);border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;margin-top:12px;}
.action-btn:hover{background:var(--td);color:#fff;}
.toast{display:none;align-items:center;gap:8px;background:var(--success-bg);border:1px solid #639922;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px;color:var(--success);font-weight:500;}
.toast-on{display:flex;}
.preview-card{background:var(--tl);border:1px solid var(--tc);border-radius:8px;padding:12px;margin-top:10px;display:none;}
.prev-lbl{font-size:10px;font-weight:600;color:var(--td);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.bar-track{height:9px;background:#e8e8e8;border-radius:5px;overflow:hidden;display:flex;margin-bottom:10px;}
.bseg{height:100%;}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0;}
.prname{flex:1;color:var(--text2);}
.prpct{min-width:44px;text-align:left;font-size:11px;color:var(--text2);direction:ltr;}
.pramt{font-weight:500;color:var(--text);min-width:80px;text-align:right;}
.log-entry{border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:8px;background:var(--bg);}
.lhdr{display:flex;justify-content:space-between;margin-bottom:8px;}
.ldate{font-size:11px;color:var(--text2);direction:ltr;}
.linc{font-size:13px;font-weight:500;color:var(--td);}
.lrow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
.lln{display:flex;align-items:center;gap:5px;color:var(--text2);}
.lla{font-weight:500;color:var(--text);}
.lsub{font-size:10px;color:var(--text2);}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;flex-shrink:0;}
.pname{font-size:14px;font-weight:500;color:var(--text);}
.screen{display:none;}
.screen.active{display:block;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.tbtitle{font-size:15px;font-weight:500;color:var(--text);flex:1;}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.badge-a{background:var(--tl);color:var(--td);border:1px solid var(--tc);}
.badge-c{background:#EAF3DE;color:#3B6D11;border:1px solid #97C459;}
.ig{margin-bottom:10px;}
.ig label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;}
.ig input,.ig select{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;}
.ig input:focus,.ig select:focus{border-color:var(--tc);}
.err{font-size:12px;color:var(--danger);margin-top:6px;}
.suc{font-size:12px;color:var(--success);margin-top:6px;}
.tab-bar{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.tab{flex:1;padding:8px;font-size:13px;background:transparent;border:none;cursor:pointer;color:var(--text2);}
.tab.on{background:var(--tc);color:var(--dk);font-weight:500;}
.exp-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ebtn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:12px;color:var(--text2);}
.ebtn:hover{background:var(--tl);}
.btn-out{padding:7px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text2);cursor:pointer;}
.btn-out:hover{background:var(--tl);}
.btn-red{padding:7px 14px;background:transparent;border:1px solid var(--danger);border-radius:8px;font-size:12px;color:var(--danger);cursor:pointer;}
.btn-red:hover{background:var(--danger-bg);}
.btn-sm{padding:6px 14px;background:var(--tc);color:var(--dk);border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:500;}
.btn-sm:hover{background:var(--td);color:#fff;}
</style>

async function sendConfirmation(clientId,entry){
  const p=state.profiles[clientId];
  console.log('sendConfirmation called, email:',p&&p.email,'notifyAlloc:',p&&p.notifyAlloc);
  if(!p||!p.email){console.warn('No email set for client');return;}
  if(p.notifyAlloc===false){console.warn('Notifications disabled');return;}
  try{
    const resp=await fetch(EDGE_EMAIL,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY},
      body:JSON.stringify({type:'confirmation',to:p.email,clientName:p.name,income:entry.income,results:entry.results,date:entry.dateNum||entry.date})
    });
    const data=await resp.json();
    console.log('Email response:',resp.status,data);
  }catch(e){console.warn('email error:',e);}
}

function calcAllocs(accts,inc){
  const res=accts.map((a,i)=>({...a,color:cl(i),pct:0,amount:0}));
  if(!inc||inc<=0)return res;
  const smart=gP().smartAlloc!==false; // default on
  if(smart){
    // ── Smart allocation: (income-10) × pct%, rounded down to ₪10 ──
    const base=inc-10;
    let usedPct=0;
    res.forEach(a=>{
      if(a.id==='op')return;
      if(a.type==='pct'){
        a.pct=parseFloat(a.value)||0;
        a.amount=rd10(base*a.pct/100);
        usedPct+=a.pct;
      } else {
        a.amount=parseFloat(a.value)||0;
        a.pct=inc>0?a.amount/inc*100:0;
        usedPct+=a.pct;
      }
    });
    const opPct=Math.max(0,100-usedPct);
    res.forEach(a=>{if(a.id==='op'){a.pct=opPct;a.amount=rd10(base*opPct/100);}});
  } else {
    // ── Simple allocation: full income, rounded to whole ₪, remainder to ops ──
    let usedAmt=0;
    let usedPct=0;
    res.forEach(a=>{
      if(a.id==='op')return;
      if(a.type==='pct'){
        a.pct=parseFloat(a.value)||0;
        a.amount=Math.floor(inc*a.pct/100); // round down to whole ₪
        usedPct+=a.pct;
        usedAmt+=a.amount;
      } else {
        a.amount=parseFloat(a.value)||0;
        a.pct=inc>0?a.amount/inc*100:0;
        usedPct+=a.pct;
        usedAmt+=a.amount;
      }
    });
    // Ops gets exact remainder so total = income
    const opPct=Math.max(0,100-usedPct);
    const opAmt=Math.max(0,inc-usedAmt);
    res.forEach(a=>{if(a.id==='op'){a.pct=opPct;a.amount=opAmt;}});
  }
  return res;
}

function filterClient(val){
  const ids=Object.keys(state.profiles);
  const match=document.getElementById('cmatch');
  const nomatch=document.getElementById('cnomatch');
  const err=document.getElementById('cerr');
  if(err)err.style.display='none';
  if(!val||val.trim().length<2){
    if(match)match.style.display='none';
    if(nomatch)nomatch.style.display='none';
    curId=null;return;
  }
  const v=val.trim().toLowerCase();
  const found=ids.find(id=>state.profiles[id].name.toLowerCase()===v);
  if(found){
    curId=found;
    if(match)match.style.display='block';
    if(nomatch)nomatch.style.display='none';
    setTimeout(()=>{const pw=document.getElementById('cpw');if(pw)pw.focus();},50);
  } else {
    curId=null;
    if(match)match.style.display='none';
    if(nomatch)nomatch.style.display='block';
  }
}

function doClientLogin(){
  if(!curId){const e=document.getElementById('cerr');if(e)e.style.display='block';return;}
  const pw=document.getElementById('cpw');if(!pw)return;
  if(H(pw.value)===state.profiles[curId].passHash){
    var btn2=document.getElementById('cpw');if(btn2)btn2.disabled=true;
    sbGet('clients','?id=eq.'+curId).then(function(rows){
      if(rows&&rows[0]){
        const r=rows[0];
        // Check subscription
        const isActive=r.active!==false;
        const subEnd=r.subscription_end;
        const expired=subEnd&&new Date(subEnd)<new Date();
        if(!isActive||expired){
          var cerr=document.getElementById('cerr');
          if(cerr){cerr.style.display='block';cerr.style.color='#E24B4A';cerr.textContent='תקופת המנוי הסתיימה. לחידוש המנוי צור קשר עם Bottom Line.';}
          if(btn2)btn2.disabled=false;
          return Promise.reject('expired');
        }
        // Update local profile
        const p=state.profiles[curId];
        if(p){
          p.email=r.email||'';p.businessName=r.business_name||'';
          p.notifyAlloc=r.notify_alloc!==false;p.reminderEnabled=r.reminder_enabled||false;
          p.reminderFrequency=r.reminder_frequency||'biweekly';p.reminderDay=r.reminder_day||'sunday';
          p.reminderDates=r.reminder_dates||'1,15';p.accounts=r.accounts||p.accounts;
          p.lastIncome=r.last_income||p.lastIncome||'';
          p.subscriptionEnd=r.subscription_end||null;p.active=r.active!==false;p.smartAlloc=r.smart_alloc!==false;
          p.createdAt=r.created_at||'';
        }
      }
      return dbLoadLog(curId);
    }).then(function(){
      showDisclaimer(buildApp);
    }).catch(function(err){
      if(err!=='expired'){showDisclaimer(buildApp);}
    });
  }
  else{const e=document.getElementById('cerr');if(e)e.style.display='block';}
}

      +'</div>';

  } else if(tab==='log_loading'){
    body='<div style="text-align:center;padding:30px;color:#999;font-size:13px;">טוען...</div>';
  } else {
    const log=p.log||[];
    if(!log.length){
      body='<p style="font-size:13px;color:#666;padding:8px 0;">אין הקצאות עדיין.</p>';
    } else {
      let logHtml='<div class="exp-bar">'
        +'<button class="ebtn" id="ca-csv-btn">ייצוא CSV</button>'
        +'<button class="ebtn" id="ca-pdf-btn">ייצוא PDF</button>'
        +'</div>';
      log.forEach(e=>{
        let rr='';
        e.results.forEach(r=>{rr+='<div class="lrow"><span class="lln"><span style="width:6px;height:6px;border-radius:50%;background:'+r.color+';display:inline-block;margin-left:4px;"></span>'+r.name+'</span><span class="lla">'+fIls(r.amount)+' <span class="lsub">('+Number(r.pct).toFixed(1)+'%)</span></span></div>';});
        logHtml+='<div class="log-entry"><div class="lhdr"><span class="ldate">'+e.date+' · '+e.time+'</span><span class="linc">'+fIls(e.income)+'</span></div>'+rr+'</div>';
      });
      body=logHtml;
    }
  }

  document.getElementById('s-admin').innerHTML=
    '<div class="topbar">'
    +'<button class="btn-out" onclick="renderAdminTab(&apos;clients&apos;)">← חזרה</button>'
    +'<span class="tbtitle" style="margin-right:8px;">'+p.name+'</span>'
    +'</div>'
    +tabs+body;
  show('admin');

  if(tab==='info'){
    // Live status update when date changes
    document.getElementById('ca-sub-end').addEventListener('change',function(){
      const val=this.value;
      const p=state.profiles[id];
      p.subscriptionEnd=val?val+'T23:59:59':null;
      const expired=p.subscriptionEnd&&new Date(p.subscriptionEnd)<new Date();
      const active=p.active!==false&&!expired;
      const col=active?'#1D9E75':'#E24B4A';
      const badge=document.getElementById('ca-status-badge');
      if(badge){badge.textContent=active?'פעיל':'לא פעיל';badge.style.color=col;badge.style.background=col+'22';}
      const display=document.getElementById('ca-sub-end-display');
      if(display)display.innerHTML='סיום מנוי: <strong>'+(val?new Date(val).toLocaleDateString('he-IL'):'ללא הגבלה')+'</strong>';
    });

    document.getElementById('ca-save-btn').addEventListener('click',function(){
      const p=state.profiles[id];
      p.businessName=document.getElementById('ca-biz').value.trim();
      p.email=document.getElementById('ca-email').value.trim();
      const subEnd=document.getElementById('ca-sub-end').value;
      p.subscriptionEnd=subEnd?subEnd+'T23:59:59':null;
      // Restore active if future date set
      if(!p.subscriptionEnd||new Date(p.subscriptionEnd)>new Date())p.active=true;
      const pw=document.getElementById('ca-pw').value;
      const saves=[dbSaveClient(id)];
      if(pw&&pw.length>=6){p.passHash=H(pw);saves.push(dbUpdateClientPw(id,H(pw)));}
      sv();
      Promise.all(saves).then(()=>{
        const msg=document.getElementById('ca-msg');
        if(msg){msg.style.display='block';msg.textContent='✓ השינויים נשמרו';setTimeout(()=>{msg.style.display='none';renderClientAdminTab('info');},2000);}
      }).catch(e=>console.warn(e));
    });

    document.getElementById('ca-expire-btn').addEventListener('click',function(){
      const _name=p.name;
      setTimeout(function(){
        if(!confirm('לסיים את המנוי של '+_name+' עכשיו?'))return;
        const p2=state.profiles[id];
        p2.subscriptionEnd=new Date().toISOString();
        p2.active=false;
        sv();
        dbSaveClient(id).then(()=>renderClientAdminTab('info')).catch(e=>console.warn(e));
      },0);
    });

    document.getElementById('ca-del-btn').addEventListener('click',function(){
      const _name=p.name;
      setTimeout(function(){
        if(!confirm('למחוק את '+_name+' וכל הנתונים?'))return;
        dbDeleteClient(id).then(()=>{delete state.profiles[id];sv();renderAdminTab('clients');}).catch(()=>{delete state.profiles[id];sv();renderAdminTab('clients');});
      },0);
    });
  } else {
    const csvBtn=document.getElementById('ca-csv-btn');
    const pdfBtn=document.getElementById('ca-pdf-btn');
    if(csvBtn)csvBtn.onclick=()=>doCSV(p);
    if(pdfBtn)pdfBtn.onclick=()=>runPDF(p);
  }
}

function createP(){
  const name=document.getElementById('nn').value.trim(),pw=document.getElementById('np').value,pw2=document.getElementById('np2').value;
  const subEndVal=document.getElementById('nsub').value;
  const subEnd=subEndVal?subEndVal+'T23:59:59':null;
  const err=document.getElementById('nerr');
  if(!name){err.style.display='block';err.textContent='נא להזין שם';return;}
  if(!pw||pw.length<6){err.style.display='block';err.textContent='לפחות 6 תווים';return;}
  if(pw!==pw2){err.style.display='block';err.textContent='הסיסמאות אינן תואמות';return;}
  const btnC=document.querySelector('#s-new .action-btn');
  if(btnC){btnC.textContent='יוצר...';btnC.disabled=true;}
  dbCreateClient(name,H(pw),subEnd).then(function(newId){
    if(!newId){if(btnC){btnC.textContent='צור פרופיל';btnC.disabled=false;}return;}
    state.profiles[newId]={name,passHash:H(pw),accounts:DEFA(),log:[],lastIncome:'',email:'',reminderEnabled:false,subscriptionEnd:subEnd,active:true,dbId:newId};
    sv();renderAdminTab('clients');
  }).catch(function(){if(btnC){btnC.textContent='צור פרופיל';btnC.disabled=false;}});
}

function setTab(t){

    +'<div id="rem-mo2" style="display:'+(freq==='twicemonthly'?'block':'none')+'">'
    +'<div class="ig"><label>יום ראשון בחודש</label>'
    +'<select id="rem-d2a" style="padding:8px 10px;font-size:13px;border:1px solid var(--br);border-radius:8px;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;outline:none;">'
    +dayOpts(date1)
    +'</select></div>'
    +'<div class="ig"><label>יום שני בחודש</label>'
    +'<select id="rem-d2b" style="padding:8px 10px;font-size:13px;border:1px solid var(--br);border-radius:8px;background:var(--color-background-primary);color:var(--color-text-primary);width:100%;outline:none;">'
    +dayOpts(date2)
    +'</select></div></div>'
    +'<button class="action-btn" id="rem-save">שמור מועדי חלוקות</button>'
    +'<div id="rem-msg" class="toast" style="margin-top:8px;"></div>'
    +'</div>';

  document.getElementById('rem-freq').addEventListener('change',function(){
    const v=this.value;
    document.getElementById('rem-wk').style.display=(v==='weekly'||v==='biweekly')?'block':'none';
    document.getElementById('rem-mo1').style.display=(v==='monthly')?'block':'none';
    document.getElementById('rem-mo2').style.display=(v==='twicemonthly')?'block':'none';
  });

  document.getElementById('rem-save').addEventListener('click',function(){
    const p=gP();
    const freq=document.getElementById('rem-freq').value;
    p.reminderFrequency=freq;
    const dayEl=document.getElementById('rem-day');
    p.reminderDay=dayEl?dayEl.value:'sunday';
    // Build dates string based on frequency
    if(freq==='monthly'){
      p.reminderDates=document.getElementById('rem-d1').value;
    } else if(freq==='twicemonthly'){
      const d1=document.getElementById('rem-d2a').value;
      const d2=document.getElementById('rem-d2b').value;
      p.reminderDates=d1+','+d2;
    } else {
      p.reminderDates='';
    }
    sv();
    dbSaveClient(curId).then(()=>{
      const msg=document.getElementById('rem-msg');
      if(msg){msg.classList.add('toast-on');msg.textContent='✓ מועדי החלוקות נשמרו';setTimeout(()=>msg.classList.remove('toast-on'),3000);}
    }).catch(e=>console.warn(e));
  });
}


function buildAllocUI(container){
  const p=gP();
  container.innerHTML=
    '<div class="card"><div class="lbl">סך הכנסות שהתקבלו</div>'
    +'<div class="inc-wrap"><span class="inc-sym">₪</span>'
    +'<input class="inc-fld" id="inc-fld" type="text" inputmode="numeric" placeholder="הזן סכום" value="'+(p.lastIncome?Number(p.lastIncome).toLocaleString('en-US'):'')+'"></div></div>'
    +'<div class="card"><div class="lbl">חשבונות הקצאה</div>'
    +'<table class="tbl"><thead><tr>'
    +'<th style="width:34%;">חשבון</th><th style="width:22%;text-align:center;">סוג</th>'
    +'<th style="width:32%;">הקצאה</th><th style="width:12%;"></th>'
    +'</tr></thead><tbody id="tbody"></tbody></table>'
    +'<button class="add-btn" id="btn-add">+ הוסף חשבון מותאם</button>'
    +'<div class="warnbox" id="warnbox"></div>'
    +'<div class="preview-card" id="preview"></div>'
    +'<button class="action-btn" id="btn-exec">בצע חלוקה</button>'
    +'<div class="toast" id="toast">✓ ההקצאה נשמרה ביומן</div></div>';
  buildRows();
  document.getElementById('inc-fld').addEventListener('input',function(){
    // Strip commas, keep only digits
    const raw=this.value.replace(/[^0-9]/g,'');
    const num=parseInt(raw)||0;
    // Store raw number
    gP().lastIncome=raw?raw:'';
    sv();
    // Reformat with commas, preserve cursor position
    const formatted=num?num.toLocaleString('en-US'):'';
    const cursorPos=this.selectionStart;
    const oldLen=this.value.length;
    this.value=formatted;
    // Adjust cursor for added/removed commas
    const newLen=this.value.length;
    const diff=newLen-oldLen;
    try{this.setSelectionRange(cursorPos+diff,cursorPos+diff);}catch(e){}
    refreshDisplay();
  });
  document.getElementById('btn-add').addEventListener('click',function(){
    const p=gP(),oi=p.accounts.findIndex(a=>a.id==='op');
    const n={id:'c'+(++custN),name:'',type:'pct',value:''};
    if(oi>-1)p.accounts.splice(oi,0,n);else p.accounts.push(n);
    sv();buildRows();
  });
  document.getElementById('btn-exec').addEventListener('click',saveAlloc);
}

function applyToggleStyle(btnPct,btnIls,isPct){
  btnPct.setAttribute('style',(isPct?STYLE_PCT_ON:STYLE_PCT_OFF)+'padding:5px 10px;font-size:12px;font-weight:'+(isPct?'700':'600')+';border-radius:6px;cursor:pointer;');
  btnIls.setAttribute('style',(!isPct?STYLE_ILS_ON:STYLE_ILS_OFF)+'padding:5px 10px;font-size:12px;font-weight:'+(!isPct?'700':'600')+';border-radius:6px;cursor:pointer;');
}

function buildRows(){
  const p=gP();
  const tbody=document.getElementById('tbody');if(!tbody)return;
  tbody.innerHTML='';
  p.accounts.forEach((a,i)=>{
    const tr=document.createElement('tr');
    if(a.id==='op'){
      tr.className='opr';
      const td1=document.createElement('td');td1.colSpan=2;
      td1.innerHTML='<div class="nc"><div class="dot" style="background:'+cl(i)+';"></div><span class="ntxt">הוצאות תפעול</span><span class="oppill">אוטו׳</span></div>';
      const td2=document.createElement('td');td2.innerHTML='<div class="opinfo" id="op-info"></div>';
      tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(document.createElement('td'));
      tbody.appendChild(tr);return;
    }
    const isFixed=['profit','owner','tax'].includes(a.id);
    const isPct=a.type==='pct';
    const tdN=document.createElement('td');
    const nc=document.createElement('div');nc.className='nc';
    const dot=document.createElement('div');dot.className='dot';dot.style.background=cl(i);nc.appendChild(dot);
    if(isFixed){const sp=document.createElement('span');sp.className='ntxt';sp.textContent=a.name;nc.appendChild(sp);}
    else{const inp=document.createElement('input');inp.className='ninp';inp.type='text';inp.value=a.name;inp.placeholder='שם חשבון';inp.addEventListener('input',()=>{gP().accounts[i].name=inp.value;sv();});nc.appendChild(inp);}
    tdN.appendChild(nc);
    const tdT=document.createElement('td');
    const tw=document.createElement('div');tw.className='twrap';
    const bP=document.createElement('button');bP.textContent='%';
    const bI=document.createElement('button');bI.textContent='₪';
    applyToggleStyle(bP,bI,isPct);
    bP.addEventListener('click',()=>{const p=gP();p.accounts[i].type='pct';p.accounts[i].value='';sv();dbSaveClient(curId).catch(e=>console.warn(e));buildRows();});
    bI.addEventListener('click',()=>{const p=gP();p.accounts[i].type='amt';p.accounts[i].value='';sv();dbSaveClient(curId).catch(e=>console.warn(e));buildRows();});
    tw.appendChild(bP);tw.appendChild(bI);tdT.appendChild(tw);
    const tdA=document.createElement('td');
    const wrap=document.createElement('div');wrap.className='awrap';
    const sym=document.createElement('span');sym.className='asym';sym.textContent=isPct?'%':'₪';
    const ainp=document.createElement('input');ainp.className='ainp';ainp.type='number';ainp.min='0';ainp.step=isPct?'0.1':'1';
    if(isPct)ainp.max='100';
    ainp.value=a.value;ainp.placeholder='0';
    ainp.addEventListener('input',()=>{gP().accounts[i].value=ainp.value;sv();clearTimeout(ainp._dbt);ainp._dbt=setTimeout(()=>dbSaveClient(curId).catch(e=>console.warn(e)),1000);refreshDisplay();});
    wrap.appendChild(sym);wrap.appendChild(ainp);tdA.appendChild(wrap);
    const tdD=document.createElement('td');
    if(!isFixed){const db=document.createElement('button');db.className='del-btn';db.textContent='×';db.addEventListener('click',()=>{gP().accounts.splice(i,1);sv();dbSaveClient(curId).catch(e=>console.warn(e));buildRows();});tdD.appendChild(db);}
    tr.appendChild(tdN);tr.appendChild(tdT);tr.appendChild(tdA);tr.appendChild(tdD);
    tbody.appendChild(tr);
  });
  refreshDisplay();
}

function refreshDisplay(){
  const p=gP();const inc=parseFloat(p.lastIncome||0);
  const allocs=calcAllocs(p.accounts,inc);
  const op=allocs.find(a=>a.id==='op')||{pct:0,amount:0};
  const usedAmt=allocs.filter(a=>a.id!=='op').reduce((s,a)=>s+a.amount,0);
  const wb=document.getElementById('warnbox');
  if(wb){if(inc>0&&usedAmt>inc){wb.style.display='block';wb.textContent='⚠ ההקצאות עולות על '+fIls(inc);}else wb.style.display='none';}
  const oi=document.getElementById('op-info');
  if(oi){const neg=op.amount<0;const cls=neg?'opval-neg':'opval';oi.innerHTML='<span class="'+cls+'">'+op.pct.toFixed(1)+'%</span><span style="color:#999;margin:0 5px;">·</span><span class="'+cls+'">'+(inc>0?fIls(op.amount):'–')+'</span>';}
  const prev=document.getElementById('preview');
  if(prev){
    if(inc>0){
      prev.style.display='block';
      const segs=allocs.map(a=>'<div class="bseg" style="width:'+Math.max(0,a.pct).toFixed(2)+'%;background:'+a.color+';"></div>').join('');
      const rows=allocs.map(a=>'<div class="prow"><div class="dot" style="background:'+a.color+';"></div><div class="prname">'+a.name+'</div><div class="prpct">'+Number(a.pct).toFixed(1)+'%</div><div class="pramt">'+fIls(a.amount)+'</div></div>').join('');
      prev.innerHTML='<div class="prev-lbl">תצוגה מקדימה</div><div class="bar-track">'+segs+'</div>'+rows;
    }else prev.style.display='none';
  }
}

function saveAlloc(){
  const p=gP();const inc=parseFloat(p.lastIncome||0);
  if(!inc){alert('נא להזין סכום הכנסות');return;}
  const results=calcAllocs(p.accounts,inc);
  const now=new Date();
  if(!p.log)p.log=[];
  const dd=String(now.getDate()).padStart(2,'0');
  const mm=String(now.getMonth()+1).padStart(2,'0');
  const yyyy=now.getFullYear();
  const hh=String(now.getHours()).padStart(2,'0');
  const mn=String(now.getMinutes()).padStart(2,'0');
  const dateStr=mm+'/'+dd+'/'+yyyy;
  const timeStr=hh+':'+mn;
  p.log.unshift({date:dateStr,dateNum:dateStr,time:timeStr,income:inc,results});
  sv();
  const entry=p.log[0];
  dbSaveAllocation(curId,entry).catch(e=>console.warn(e));
  dbSaveClient(curId).catch(e=>console.warn(e));
  sendConfirmation(curId,entry);
  const toast=document.getElementById('toast');
  if(toast){toast.classList.add('toast-on');setTimeout(()=>toast.classList.remove('toast-on'),3000);}
  const lt=document.getElementById('tab-log');if(lt)lt.textContent='יומן ('+p.log.length+')';
}

function buildLogUI(container){
  const p=gP();const log=p.log||[];
  if(!log.length){container.innerHTML='<p style="font-size:13px;color:#666;padding:8px 0;">אין הקצאות עדיין.</p>';return;}
  let html='<div class="exp-bar"><button class="ebtn" id="btn-csv">ייצוא CSV</button><button class="ebtn" id="btn-pdf">ייצוא PDF</button><button class="btn-red" id="btn-clr">נקה יומן</button></div>';
  log.forEach(e=>{
    let rr='';
    e.results.forEach(r=>{rr+='<div class="lrow"><span class="lln"><span style="width:6px;height:6px;border-radius:50%;background:'+r.color+';display:inline-block;margin-left:4px;"></span>'+r.name+'</span><span class="lla">'+fIls(r.amount)+' <span class="lsub">('+Number(r.pct).toFixed(1)+'%)</span></span></div>';});
    html+='<div class="log-entry"><div class="lhdr"><span class="ldate">'+e.date+' · '+e.time+'</span><span class="linc">'+fIls(e.income)+'</span></div>'+rr+'</div>';
  });
  container.innerHTML=html;
  document.getElementById('btn-csv').onclick=()=>doCSV(p);
  document.getElementById('btn-pdf').onclick=()=>runPDF(p);
  document.getElementById('btn-clr').onclick=()=>{
    if(!confirm('למחוק את כל יומן ההקצאות?'))return;
    sbDelete('allocations','?client_id=eq.'+curId).catch(e=>console.warn(e));
    gP().log=[];sv();renderTab();
  };
}

function mkCSV(p){
  const rows=[['תאריך','שעה','הכנסות','חשבון','סכום','אחוז']];
  (p.log||[]).forEach(e=>e.results.forEach(r=>rows.push([e.date,e.time,e.income,r.name,r.amount,Number(r.pct).toFixed(1)+'%'])));
  return'\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
function doCSV(p){
  const blob=new Blob([mkCSV(p)],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(p.name||'client').replace(/\s/g,'_')+'_profit_first.csv';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},300);
}

  function rhebrew(str){
    str=String(str||'');
    var words=str.split(' ');
    var rev=words.map(function(w){
      if(/[א-ת]/.test(w))return w.split('').reverse().join('');
      return w;
    });
    return rev.reverse().join(' ');
  }

  // Convert stored date string to DD/MM/YYYY
  // Handles: "18 במרץ 2026", "18/3/2026", or dateNum field
  function fmtDateNum(e){
    if(e.dateNum)return e.dateNum;
    var s=String(e.date||'');
    // Hebrew month map
    var hm={
      'ינו':1,'פבר':2,'מרץ':3,'אפר':4,
      'מאי':5,'יונ':6,'יול':7,'אוג':8,
      'ספט':9,'אוק':10,'נוב':11,'דצמ':12
    };
    var nums=s.match(/\d+/g)||[];
    var day=nums[0]||'';
    var year=nums[1]||'';
    var month=0;
    var keys=Object.keys(hm);
    for(var i=0;i<keys.length;i++){if(s.indexOf(keys[i])>-1){month=hm[keys[i]];break;}}
    if(day&&year&&month)return day+'/'+month+'/'+year;
    if(day&&year)return day+'/'+year; // fallback
    return s;
  }

  function attempt(){
    if(typeof window.jspdf==='undefined'||!window.jspdf.jsPDF){setTimeout(attempt,700);return;}
    var jsPDF=window.jspdf.jsPDF;
    var b=state.brand||{};
    var doc=new jsPDF({unit:'mm',format:'a4'});
    doc.addFileToVFS('DejaVuSans.ttf',FONT_B64);
    doc.addFont('DejaVuSans.ttf','DejaVuSans','normal');
    doc.setFont('DejaVuSans','normal');
    var W=210,M=18,y=22;
    function rtxt(txt,x,yy){doc.text(rhebrew(txt),x,yy,{align:'right'});}
    function ltxt(txt,x,yy){doc.text(String(txt),x,yy,{align:'left'});}

    doc.setFontSize(13);doc.setTextColor(20);
    rtxt((b.name||'Bottom Line')+' — Profit First',W-M,y);y+=7;
    doc.setFontSize(9);doc.setTextColor(100);
    rtxt('לקוח: '+(p.name||''),W-M,y);
    var now=new Date();
    ltxt(now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear(),M,y);
    y+=12;

    (p.log||[]).forEach(function(e){
      if(y>265){doc.addPage();y=22;}
      doc.setFillColor(232,248,247);doc.setDrawColor(91,200,192);
      doc.roundedRect(M,y,W-M*2,8,2,2,'FD');
      doc.setFontSize(10);doc.setTextColor(30);
      var dispDate=fmtDateNum(e);
      doc.text(dispDate+' · '+String(e.time||''),W-M-3,y+5.5,{align:'right'});
      ltxt('ILS '+Number(e.income).toLocaleString(),M+3,y+5.5);
      y+=11;
      (e.results||[]).forEach(function(r){
        if(y>272){doc.addPage();y=22;}
        doc.setFontSize(9);doc.setTextColor(60);
        rtxt(r.name||'',W-M-4,y);
        doc.setTextColor(30);
        ltxt('ILS '+Number(r.amount||0).toLocaleString(),M+4,y);
        doc.setTextColor(120);
        ltxt(Number(r.pct||0).toFixed(1)+'%',M+38,y);
        y+=5.5;
      });y+=5;
    });
    doc.save((p.name||'client').replace(/\s/g,'_')+'_profit_first.pdf');
  }
  attempt();
}
